# Publishes the package to npm when a GitHub release is published.
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored in GitHub.
# Configure the trusted publisher on npmjs.com with the workflow filename `publish.yml`.
#
# Use the manual trigger only to publish a version that has a GitHub release but is not on npm.
# Run it on a branch that holds that version, for example `release/0.3.0`.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match package.json on the selected branch)'
        required: true
      dist-tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}
      DIST_TAG: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'next' || 'latest') || inputs.dist-tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check that the version matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "Expected $EXPECTED_VERSION, but package.json has $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # A GitHub pre-release publishes to the `next` dist-tag, so `latest` does not change.
      - run: npm publish --provenance --access public --tag "$DIST_TAG"
